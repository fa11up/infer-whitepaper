name: Pin to IPFS

# Pins the paper on every push to main and prints the CID in the run summary.
# Updating the ENS contenthash stays manual on purpose: automating it would put
# a wallet key in CI, and the wallet controlling miyagod.eth is not a key that
# belongs in a GitHub secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p site
          cp index.html site/
          echo "staged:"; ls -la site

      - name: Sanity-check the page
        run: |
          test -s site/index.html || { echo "index.html missing or empty"; exit 1; }
          grep -q "<title>" site/index.html || { echo "no <title>"; exit 1; }
          bytes=$(wc -c < site/index.html)
          echo "index.html is $bytes bytes"
          [ "$bytes" -gt 50000 ] || { echo "suspiciously small — refusing to pin"; exit 1; }

      - name: Pin to IPFS via Pinata
        id: pin
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          if [ -z "$PINATA_JWT" ]; then
            echo "::error::PINATA_JWT secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi

          # Shape-check the credential before spending a request on it. Only
          # structural facts are printed - never any part of the token itself.
          # Whitespace is the commonest paste artifact and is never valid in a
          # JWT, so strip it rather than making a human re-paste a 680-char token.
          JWT=$(printf '%s' "$PINATA_JWT" | tr -d '[:space:]')
          raw=$(printf '%s' "$PINATA_JWT" | wc -c | tr -d ' ')
          len=$(printf '%s' "$JWT" | wc -c | tr -d ' ')
          segs=$(printf '%s' "$JWT" | awk -F. '{print NF}')
          if [ "$raw" -ne "$len" ]; then
            echo "note: stripped $((raw - len)) whitespace character(s) from the credential"
          fi
          echo "credential: $segs dot-separated segments, $len characters"
          if [ "$segs" -ne 3 ]; then
            echo "::error::PINATA_JWT is not a JWT ($segs segments, expected 3). Pinata shows an API Key, an API Secret and a JWT - this needs the JWT, the long value beginning eyJhbGciOi."
            exit 1
          fi
          case "$JWT" in
            eyJ*) ;;
            *) echo "::error::PINATA_JWT has 3 segments but does not begin eyJ. Check for a stray Bearer prefix, surrounding quotes, or a truncated paste."; exit 1 ;;
          esac
          case "$JWT" in
            *[!A-Za-z0-9._-]*) echo "::error::PINATA_JWT contains a character not valid in a JWT - likely a space, newline or quote picked up during paste."; exit 1 ;;
          esac

          resp=$(curl -sS -X POST https://api.pinata.cloud/pinning/pinFileToIPFS \
            -H "Authorization: Bearer $JWT" \
            -F "file=@site/index.html;filename=index.html" \
            -F 'pinataOptions={"cidVersion":1,"wrapWithDirectory":true}' \
            -F "pinataMetadata={\"name\":\"index.html\",\"keyvalues\":{\"commit\":\"${GITHUB_SHA::7}\"}}")
          echo "$resp"

          cid=$(printf '%s' "$resp" | grep -o '"IpfsHash":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$cid" ]; then
            reason=$(printf '%s' "$resp" | grep -o '"reason":"[^"]*"' | head -1 | cut -d'"' -f4)
            case "$reason" in
              INVALID_CREDENTIALS)
                echo "::error::Pinata rejected the credential (INVALID_CREDENTIALS). The JWT is wrong, revoked, or belongs to a different Pinata account." ;;
              *SCOPE*|NO_SCOPES_FOUND)
                echo "::error::Credential accepted but it lacks the pinFileToIPFS scope." ;;
              *)
                echo "::error::Pinata returned no CID. Full response is logged above." ;;
            esac
            exit 1
          fi
          mime=$(printf '%s' "$resp" | grep -o '"MimeType":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ "$mime" != "directory" ]; then
            echo "::error::Expected a directory-wrapped pin so index.html sits at the root (ENS contenthash cannot carry a path), but Pinata reported MimeType=$mime."
            exit 1
          fi
          echo "shape: directory with index.html at its root - correct for an ENS contenthash"
          echo "cid=$cid" >> "$GITHUB_OUTPUT"

      - name: Verify the pinned CID serves the paper
        run: |
          cid="${{ steps.pin.outputs.cid }}"
          echo "verifying ipfs://$cid resolves to the paper at its root"
          ok=""
          for gw in "https://ipfs.io/ipfs" "https://dweb.link/ipfs" "https://w3s.link/ipfs" "https://flk-ipfs.xyz/ipfs" "https://ipfs.eth.aragon.network/ipfs"; do
            code=$(curl -sL --max-time 60 -o /tmp/fetched.html -w '%{http_code}' "$gw/$cid/" || echo 000)
            echo "  $gw -> HTTP $code"
            [ "$code" = "200" ] || continue
            # A directory listing means the wrapper has no index.html at its
            # root, so an ENS contenthash would show a file index, not the paper.
            if grep -qi "A directory of content-addressed files\|Index of" /tmp/fetched.html; then
              echo "::error::$gw served a DIRECTORY LISTING for this CID. The wrapped directory does not contain index.html at its root, so ENS would show a file index instead of the paper."
              exit 1
            fi
            if grep -q "<title>INFER" /tmp/fetched.html; then
              bytes=$(wc -c < /tmp/fetched.html | tr -d ' ')
              echo "  served $bytes bytes with the expected <title>"
              ok=1; break
            fi
          done
          if [ -z "$ok" ]; then
            echo "::warning::Could not confirm the CID through a public gateway (they rate-limit heavily). Check https://ipfs.io/ipfs/$cid/ in a browser before updating ENS - it must render the paper, not a directory listing."
          else
            echo "confirmed: the CID serves the paper directly at its root"
          fi

      - name: Summary
        run: |
          cid="${{ steps.pin.outputs.cid }}"
          {
            echo "## Pinned to IPFS"
            echo
            echo '```'
            echo "$cid"
            echo '```'
            echo
            echo "- Gateway: https://ipfs.io/ipfs/$cid"
            echo "- Pinata:  https://gateway.pinata.cloud/ipfs/$cid"
            echo
            echo "### To publish"
            echo "Set the \`contenthash\` of \`infer.miyagod.eth\` to:"
            echo
            echo '```'
            echo "ipfs://$cid"
            echo '```'
            echo
            echo "at [app.ens.domains](https://app.ens.domains). Until then, the ENS name still"
            echo "serves the previous CID."
          } >> "$GITHUB_STEP_SUMMARY"
